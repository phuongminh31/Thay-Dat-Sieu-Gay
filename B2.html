    <div id="button1">
        <button class="button1" onclick="document.getElementById('Cau_hoi').style.color='pink'; document.getElementById('Cau_hoi').style.transition='all 0.3s ease'">Dong tinhs</button>
    </div>
    <div id="button2">
        <button class="button2" onclick="changeSevenColors(Pink)">Dong tinhf</button>
    </div>

    <script>
        const colors = ['pink', 'blue', 'green', 'orange', 'purple', 'red', 'yellow'];
        let colorIndex = 0;

        function changeSevenColors() {
            document.getElementById('Cau_hoi').style.color = colors[colorIndex];
            colorIndex = (colorIndex + 1) % colors.length;
        }

        setInterval(changeSevenColors, 500);
    </script>
